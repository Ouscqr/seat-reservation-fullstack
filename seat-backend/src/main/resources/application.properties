# ============================================================================
# Database
# ============================================================================
# Zonder env vars: H2 in-memory (lokaal; data verdwijnt bij elke restart).
# Op Render: DB_URL / DB_USER / DB_PASSWORD van de Postgres-service zetten,
# bijv. DB_URL=jdbc:postgresql://<host>:5432/<db>
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
# driver-class-name bewust NIET hardcoden: Spring kiest H2 of PostgreSQL op
# basis van de URL, zodat dezelfde build lokaal en op Render werkt.

# ============================================================================
# Server
# ============================================================================
# Render zet een PORT env var; lokaal blijft het 8080
server.port=${PORT:8080}

# ============================================================================
# Hibernate
# ============================================================================
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true
# Geen vaste dialect: Hibernate detecteert H2 / PostgreSQL zelf uit de URL

# ============================================================================
# data.sql
# ============================================================================
# Lokaal: always (H2 is toch elke start leeg).
# Met Postgres: DB_INIT_MODE=never, anders komen de rijen er bij elke deploy bij.
spring.sql.init.mode=${DB_INIT_MODE:always}

# ============================================================================
# H2 console (lokaal handig; H2 blokkeert remote toegang standaard)
# ============================================================================
spring.h2.console.enabled=${H2_CONSOLE:true}
